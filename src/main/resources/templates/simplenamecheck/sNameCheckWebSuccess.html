<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>간편실명인증_결과</title>
</head>
<body>
<span>결과 코드 : </span><span th:text="${iReturn}"></span><br>
<span>결과 메세지 : </span><span th:text="${sMessage}"></span><br>
<hr>
<span>복호화 데이터</span>
<ul>
  <li th:each="entry : ${mapResult}">
    <strong th:text="${entry.key}">키</strong>: <span th:text="${entry.value}">값</span>
  </li>
</ul>
</body>
</html>
